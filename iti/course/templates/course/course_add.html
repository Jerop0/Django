{% extends 'iti/base.html' %}
{% block title %}Add Course{% endblock %}
{% block content %}
<h2>Add Course</h2>
<form method="post">
    {% csrf_token %}
    <label>Name: <input type="text" name="name"></label><br>
    <label>Code: <input type="text" name="code"></label><br>
    <label>Track: <input type="text" name="track"></label><br>
    <input type="submit" value="Add">
</form>
<a href="{% url 'Course_List' %}">Back to List</a>
{% endblock %}
