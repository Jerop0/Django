{% extends 'iti/base.html' %}
{% block title %}Registration{% endblock %}
{% block content %}
<h2>Registration</h2>
{% if user.is_authenticated %}
<p>Welcome, {{ user.username }}!</p>
<a href="{% url 'Registeration_Logout' %}">Logout</a>
{% else %}
<a href="{% url 'Registeration_Login' %}">Login</a>
<a href="{% url 'Registeration_Signup' %}">Signup</a>
{% endif %}
{% endblock %}
