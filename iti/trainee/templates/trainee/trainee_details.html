{% extends 'iti/base.html' %}
{% block title %}Trainee Details{% endblock %}
{% block content %}
<h2>Trainee Details</h2>
<table border="1">
    <tr><th>ID</th><td>{{ trainee.ID }}</td></tr>
    <tr><th>Name</th><td>{{ trainee.name }}</td></tr>
    <tr><th>Age</th><td>{{ trainee.age }}</td></tr>
    <tr><th>Degree</th><td>{{ trainee.degree }}</td></tr>
</table>
<a href="{% url 'Trainee_Update' trainee.ID %}">Update</a>
<a href="{% url 'Trainee_Delete' trainee.ID %}">Delete</a>
<a href="{% url 'Trainee_List' %}">Back to List</a>
{% endblock %}
