{% extends 'iti/base.html' %}
{% block title %}Trainee List{% endblock %}
{% block content %}
<h2>Trainee List</h2>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Degree</th>
        <th>Actions</th>
    </tr>
    {% for student in students %}
    <tr>
        <td>{{ student.ID }}</td>
        <td><a href="{% url 'Trainee_Details' student.ID %}">{{ student.name }}</a></td>
        <td>{{ student.age }}</td>
        <td>{{ student.degree }}</td>
        <td>
            <a href="{% url 'Trainee_Update' student.ID %}">Update</a>
            <a href="{% url 'Trainee_Delete' student.ID %}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
<a href="{% url 'Trainee_Add' %}">Add Trainee</a>
{% endblock %}
